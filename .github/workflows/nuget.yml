name: nuget

on:
  workflow_dispatch:
    inputs:
      release:
        type: boolean
        default: false
        required: false
        description: "Release? If true, publish to nuget.org"

jobs:
  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v3

      - name: make native
        run: make build-native

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: libironcalc_dotnet-${{ runner.os }}-${{ matrix.target }}.dylib
          path: target/release/libironcalc_dotnet.dylib

  nuget:
    name: Build, test and publish to nuget.org
    runs-on: ubuntu-latest
    needs: [macos]
    defaults:
      run:
        shell: bash
        working-directory: ./bindings/dotnet
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          path: bindings/dotnet/ironcalc-dotnet/IronCalc/runtimes/

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: dotnet test
        run: dotnet test ironcalc-dotnet

      - name: dotnet pack
        run: dotnet pack ironcalc-dotnet/IronCalc

      - name: nuget push
        if: ${{ github.event.inputs.release == 'true' }}
        run: nuget push ironcalc-dotnet/IronCalc/bin/Release/IronCalc*.nupkg -Source 'https://api.nuget.org/v3/index.json' -ApiKey ${{secrets.NUGET_API_KEY}}
